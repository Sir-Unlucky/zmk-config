include:
  ### SOFLE V1 - LEFT HALF ###
  # Builds the firmware for the left half with OLED support.
  - board: nice_nano_v2
    shield: sofle_left nice_oled
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Sofle_Oled\"  -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SLEEP=y
    artifact-name: sofle_left_oled

  ### SOFLE V1 - RIGHT HALF ###
  # Builds the firmware for the right half with OLED support.
  - board: nice_nano_v2
    shield: sofle_right nice_oled
    cmake-args: -DCONFIG_ZMK_SLEEP=y
    artifact-name: sofle_right_oled

  ### SOFLE V1 - DONGLE/RECEIVER ###
  # Builds the firmware for the dongle with OLED support.
  - board: nice_nano_v2
    shield: sofle_dongle_pro_micro dongle_display
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"SofleDongle_P\"  -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle_dongle_oled

  ### UTILITY - SETTINGS RESET ###
  # Builds a utility firmware to reset bluetooth pairing on a nice!nano v2.
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset_n!n_v2